# A股指标信号研究与每日扫描的统一配置。研究脚本和扫描脚本读同一份，保证口径一致。

universe:
  indices: [hs300, zz500]            # 沪深300 + 中证500，用 baostock 历史成分股（时点一致，减少幸存者偏差）
  snapshot_start: "2015-01-01"

research:
  start: "2015-01-01"
  end: "2026-09-18"                  # 最后一个完整交易日。盘中运行时不能把当天未收盘的K线算进来
  in_sample_end: "2021-12-31"        # 此前为样本内，之后为样本外（2022-01 起）
  horizons: [1, 3, 5, 10, 20]        # 持有交易日数：信号日收盘出信号 → 次日开盘买入 → 再过 H 个交易日开盘卖出
  min_amount_20d: 30000000           # 20 日平均成交额下限（元），过滤流动性差、难以成交的股票

costs:
  commission_rate: 0.00025           # 佣金（单边），按自己券商实际费率修改
  slippage_per_side: 0.0005          # 滑点（单边）。先假设 5bp，手动执行一段时间后用真实成交校准
  # 印花税（卖出）和过户费（双边）按成交日期自动取当时的费率，见 common.py

scan:                                # 每日扫描生成信号单时用
  equity: 1000000                    # 账户权益（元），用来算建议股数
  risk_per_trade: 0.005              # 单笔风险：触发止损时最多亏权益的 0.5%
  max_position_pct: 0.10             # 单只股票最多占权益的 10%
  stop_atr: 2.0                      # 止损 = 参考价 − 2 × ATR
  max_chase: 0.02                    # 次日开盘价比参考价高 2% 以上就不追
  min_amount_20d: 30000000           # 与研究口径一致的流动性下限

selection:                           # “强信号”准入门槛（全部满足才算）
  horizon: 5                         # 用哪个持有期做评判
  min_events: 300                    # 最少事件数
  min_dates: 100                     # 最少出现的交易日数
  min_t_full: 3.0                    # 全样本 t 值（按日期聚类、Newey-West 调整）；测了几十个信号，门槛要高
  min_t_oos: 2.0                     # 样本外 t 值
  min_net_excess: 0.002              # 扣成本后相对市场的平均超额收益 ≥ 0.2%
  min_positive_year_ratio: 0.6       # 至少 60% 的年份方向一致
